services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      DATA_DIR: /app/data
      MODELS_DIR: /app/models
      ARTIFACTS_DIR: /app/artifacts
      DEVICE: cpu
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
